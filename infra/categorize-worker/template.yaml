AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Async categorization worker for WordPressOpportunityHarvester

Parameters:
  DbSecretArn:
    Type: String
    Description: ARN of the DB credentials secret
    Default: arn:aws:secretsmanager:eu-west-2:905418231751:secret:credentials-db-mysql-wellmind-GHR3MG
  OpenRouterSecretArn:
    Type: String
    Description: ARN of the OpenRouter API key secret
    Default: arn:aws:secretsmanager:eu-west-2:905418231751:secret:secret-api-key-sf-ai-management-helper-openrouter-api-key-8BvnV4
  DatabaseUrl:
    Type: String
    Description: Direct DATABASE_URL (preferred over Secrets Manager fetch)
    NoEcho: true
  OpenRouterApiKey:
    Type: String
    Description: Direct OPENROUTER_API_KEY
    NoEcho: true
  EnqueueSharedSecret:
    Type: String
    Description: Shared secret required in X-Shared-Secret header on enqueue Function URL
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 1024
    Timeout: 900
    Architectures:
      - x86_64

Resources:
  CategorizeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: categorize-jobs
      VisibilityTimeout: 960
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CategorizeDLQ.Arn
        maxReceiveCount: 2

  CategorizeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: categorize-jobs-dlq
      MessageRetentionPeriod: 1209600

  CategorizeWorkerFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: categorize-worker
      Handler: handler.handler
      CodeUri: ./dist
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DbSecretArn
          OPENROUTER_SECRET_ARN: !Ref OpenRouterSecretArn
          DATABASE_URL: !Ref DatabaseUrl
          OPENROUTER_API_KEY: !Ref OpenRouterApiKey
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbSecretArn
                - !Ref OpenRouterSecretArn
      Events:
        SqsEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CategorizeQueue.Arn
            BatchSize: 1

  CategorizeEnqueueFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: categorize-enqueue
      Handler: enqueue.handler
      CodeUri: ./dist
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          CATEGORIZE_QUEUE_URL: !Ref CategorizeQueue
          ENQUEUE_SHARED_SECRET: !Ref EnqueueSharedSecret
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt CategorizeQueue.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

Outputs:
  QueueUrl:
    Description: SQS queue URL for enqueueing categorize jobs
    Value: !Ref CategorizeQueue
    Export:
      Name: CategorizeQueueUrl
  QueueArn:
    Description: SQS queue ARN
    Value: !GetAtt CategorizeQueue.Arn
    Export:
      Name: CategorizeQueueArn
  EnqueueFunctionUrl:
    Description: Function URL for enqueueing categorize jobs from SSR
    Value: !GetAtt CategorizeEnqueueFnUrl.FunctionUrl
    Export:
      Name: CategorizeEnqueueUrl
